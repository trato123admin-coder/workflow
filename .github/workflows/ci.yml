name: CI Pipeline

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Code Formatting Check
        run: pnpm format:check

      - name: Build Shared Package
        run: pnpm --filter @workflow/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test

  security-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --config .gitleaks.toml

  database-tests:
    name: Supabase RLS & Database Tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Containers
        run: supabase start

      - name: Run Database Tests (pgTAP)
        id: pgtap
        run: |
          set -o pipefail
          supabase test db --debug 2>&1 | tee pgtap_output.log

      - name: Report pgTAP Test Summary
        if: always()
        run: |
          echo "### pgTAP Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 pgtap_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f pgtap_output.log ]; then
            grep -E "not ok|FAIL|Error|failed|# Looks like" pgtap_output.log | tail -n 25 | while IFS= read -r line; do
              echo "::error title=pgTAP::$line"
            done
          fi

  engine-docker:
    name: Engine Docker Build & LibreOffice Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Engine Docker Image
        run: |
          docker build -t workflow-engine:ci -f services/engine/Dockerfile .

      - name: Verify LibreOffice Headless in Container
        run: |
          docker run --rm workflow-engine:ci soffice --version

      - name: Verify Liberation and Carlito Fonts
        run: |
          docker run --rm workflow-engine:ci fc-list : family | grep -E "Liberation|Carlito"

