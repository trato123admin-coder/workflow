title = "Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for documentation examples, tests, and verify scripts"
paths = [
  '''^\.env\.example$''',
  '''^services/engine/\.env\.example$''',
  '''docs/.*''',
  '''.*__tests__/.*''',
  '''supabase/verify/.*''',
]
regexes = [
  '''APIINTI_API_KEY=''',
  '''SUPABASE_.*_KEY=''',
  '''short_secret_below_32_chars''',
  '''v_notif1\.dedupe_key''',
  '''dev_tick_secret_placeholder''',
]
